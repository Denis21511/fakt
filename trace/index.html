<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#171916" />
    <meta name="description" content="TRACE — цифровые паспорта изделий для производителей. Каждое изделие. Вся история. Один код." />
    <title>TRACE — цифровые паспорта изделий</title>
    <script>
      // GitHub Pages: прямые ссылки (в том числе из QR-кодов) приходят через 404.html как ?r=<путь> — возвращаем исходный адрес
      (function () {
        var m = location.search.match(/[?&]r=([^&]*)/);
        if (m) history.replaceState(null, '', location.pathname.replace(/\/?$/, '/') + decodeURIComponent(m[1]) + location.hash);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
